<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="My personal homepage — quick links to everywhere I need to go." />
  <title>My Homepage</title>

  <!-- Google Fonts & External Assets Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://t3.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="main-content">
    <div class="site-switcher" id="site-switcher">
      <button id="sidebar-toggle" class="sidebar-toggle" title="Switch Site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <div class="site-menu" id="site-menu">
        <button id="nav-home" class="site-option active">Homepage</button>
        <button id="nav-stats" class="site-option">Heatmap & Stats</button>
      </div>
    </div>

    <div id="home-view" class="view active">
      <div class="container" id="app"></div>
    </div>
    <div id="stats-view" class="view">
      <iframe id="stats-iframe" data-src="stats/index.html" frameborder="0" width="100%" height="100%"></iframe>
    </div>
  </div>

  <div id="modal-backdrop"></div>

  <!-- Note: We defer loading non-critical external libraries -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="config.js?v=3"></script>
  <!-- Modules (load order matters: storage first, app last) -->
  <script src="js/storage.js?v=2"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/rss.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/categories.js?v=3"></script>
  <script src="js/pomodoro.js?v=2"></script>
  <script src="js/scratchpad.js?v=3"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
